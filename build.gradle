plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against, on EVERY branch
// -- same reasoning as LegendQuest: three files called storyteller-0.1.0.jar
// are indistinguishable in a mods folder. The version inside
// neoforge.mods.toml stays a plain 0.1.0.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

repositories {
    // Add additional repositories here if required by dependencies below.
}

base {
    archivesName = mod_id
}

// 26.x ships java-runtime-epsilon (Java 25) to players, so Java 25 is not
// optional on this branch.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The Storyteller's own client. Named so the log tells you which of
        // the two windows you are looking at.
        clientBuddy {
            client()
            // 25570, not the default 25565. Six of Sable's mods have a dev
            // server; each owns a port pair, because a collision on the game
            // port fails loudly but a collision on RCON just answers "auth
            // failed" forever. See CLAUDE.md.
            programArguments.addAll '--username', 'TestBuddy', '--quickPlayMultiplayer', '127.0.0.1:25570'
            gameDirectory = file('runBuddy')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Compile against the LegendQuest jar, matched to THIS branch's
    // minecraft_version. Lifted wholesale from LegendQuest-SkillPack-Example,
    // which already learned the lessons below the hard way.
    //
    // Version-matched rather than "whatever jar is in libs/", because
    // libs/*.jar is gitignored: an untracked file does not follow a branch
    // switch, so a plain wildcard silently compiles the 1.21.11 branch against
    // whichever jar the last build happened to leave behind.
    compileOnly files(provider {
        // Exactly ONE jar, newest-first, because more than one can match. A
        // build directory accumulates versions, and handing javac both puts
        // the older API on the classpath first -- which fails pointing at your
        // code rather than at the stale jar actually causing it.
        def pattern = ~/legendquest-.*\+mc${minecraft_version}\.jar/
        def candidates = [file('libs'), file('../LegendQuest-ReForged/build/libs')]
                .findAll { it.isDirectory() }
                .collectMany { (it.listFiles() ?: []) as List }
                .findAll { it.name ==~ pattern }
        if (candidates.isEmpty()) {
            throw new GradleException(
                "No LegendQuest jar for Minecraft ${minecraft_version}. Build the matching " +
                "LegendQuest branch, or drop its jar in libs/.")
        }
        candidates.sort { -it.lastModified() }
        logger.lifecycle("LegendQuest dependency: ${candidates.first().name}")
        [candidates.first()]
    })

    // Standards supplies the economy (money rewards) and vanish. compileOnly
    // and NOT jarJar'd: it is a SOFT dependency, so StoryTeller builds against
    // the API and runs perfectly well without the mod present. EconomySupport
    // is the only class that imports it.
    //
    // Version-matched for the same reason the LegendQuest jar above is: that
    // directory holds a standards jar for every Minecraft version, and a plain
    // `standards-*.jar` wildcard hands javac all three. An empty result is
    // fine here -- a soft dependency that is simply absent should leave the API
    // off the classpath, not fail configuration.
    compileOnly files(provider {
        def pattern = ~/standards-.*\+mc${minecraft_version}\.jar/
        def found = (file('../SableCraft-Standards/build/libs').listFiles() ?: [])
                .findAll { it.name ==~ pattern }
                .sort { -it.lastModified() }
        if (found.isEmpty()) {
            logger.lifecycle("Standards: no jar for Minecraft ${minecraft_version}; " +
                "building without the optional economy/vanish API.")
            return []
        }
        logger.lifecycle("Standards dependency: ${found.first().name}")
        [found.first()]
    })

    // CityWorld supplies its schematic library (legacy .schematic, WorldEdit
    // .schem, Litematica .litematic, vanilla .nbt) as a second pool for the
    // Storyteller's set-dressing tools. Soft dependency, same reasoning and
    // same version-matched lookup as Standards above -- CityWorldSupport is
    // the only class that imports it.
    compileOnly files(provider {
        def pattern = ~/cityworld-.*\+mc${minecraft_version}\.jar/
        def found = (file('../CityWorld-ReForged/build/libs').listFiles() ?: [])
                .findAll { it.name ==~ pattern }
                .sort { -it.lastModified() }
        if (found.isEmpty()) {
            logger.lifecycle("CityWorld: no jar for Minecraft ${minecraft_version}; " +
                "building without the optional schematic-library API.")
            return []
        }
        logger.lifecycle("CityWorld dependency: ${found.first().name}")
        [found.first()]
    })

    // Cast owns NPC entities -- human bodies (phantoms driven by packets) and
    // mob bodies. StoryTeller drives them when present, unchanged when not.
    compileOnly files(provider {
        def pattern = ~/cast-.*\+mc${minecraft_version}\.jar/
        def found = (file('../Cast/build/libs').listFiles() ?: [])
                .findAll { it.name ==~ pattern }
                .sort { -it.lastModified() }
        if (found.isEmpty()) {
            logger.lifecycle("Cast: no jar for Minecraft ${minecraft_version}; " +
                "building without the optional NPC API.")
            return []
        }
        logger.lifecycle("Cast dependency: ${found.first().name}")
        [found.first()]
    })
}

// LegendQuest is a HARD, required dependency (see the mods.toml template) --
// FML refuses to load StoryTeller at all without it, on client or server
// alike. Drop the same jar into both run directories before launch, so a
// fresh checkout cannot start either half missing its own dependency.
def legendQuestJar = provider {
    def pattern = ~/legendquest-.*\+mc${minecraft_version}\.jar/
    [file('libs'), file('../LegendQuest-ReForged/build/libs')]
            .findAll { it.isDirectory() }
            .collectMany { (it.listFiles() ?: []) as List }
            .findAll { it.name ==~ pattern }
            .sort { -it.lastModified() }
            .take(1)
}

// ...and LegendQuest's OWN hard dependency has to come with it. Since
// LegendQuest 2.5.0 its mods.toml declares `standards [1.8.0,)` as required,
// so staging LegendQuest alone produces a run that dies at load with "Mod
// legendquest requires standards 1.8.0 or above" -- a message that names two
// other mods and never mentions this one, which is a poor thing to hand
// somebody who just cloned the repo and typed runClientBuddy.
//
// This is a runtime staging concern only, and does NOT make Standards a hard
// dependency of StoryTeller: it stays `optional` in our mods.toml, and the
// list below is a `take(1)` on whatever happens to be there, so a machine
// without a Standards build simply stages nothing extra. It is a transitive
// requirement of LegendQuest, not one of ours.
def standardsJar = provider {
    def pattern = ~/standards-.*\+mc${minecraft_version}\.jar/
    [file('libs'), file('../SableCraft-Standards/build/libs')]
            .findAll { it.isDirectory() }
            .collectMany { (it.listFiles() ?: []) as List }
            .findAll { it.name ==~ pattern }
            .sort { -it.lastModified() }
            .take(1)
}
// Sweep first, because Copy adds and never removes -- and run/ and runBuddy/
// are gitignored, so they do NOT follow a branch switch. Staging onto a
// directory left behind by another branch leaves two Minecraft versions of the
// same mod side by side (observed: four jars, 1.21.11 and 26.1.2 together), and
// FML then refuses to load against the wrong one. The failure names a version
// mismatch rather than a stale directory, which is a bad place to start
// debugging from. Only our own two mods are swept; anything else a person put
// there on purpose is left alone.
def sweepStaged = { File dir ->
    (dir.listFiles() ?: []).findAll {
        it.name ==~ ~/(legendquest|standards)-.*\.jar/ && !it.name.contains("+mc${minecraft_version}.")
    }.each { it.delete() }
}
tasks.register('stageLegendQuestServer', Copy) {
    doFirst { sweepStaged(file('run/mods')) }
    from(legendQuestJar)
    from(standardsJar)
    into file('run/mods')
}
tasks.register('stageLegendQuestBuddy', Copy) {
    doFirst { sweepStaged(file('runBuddy/mods')) }
    from(legendQuestJar)
    from(standardsJar)
    into file('runBuddy/mods')
}
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'stageLegendQuestServer' }
tasks.matching { it.name == 'runClientBuddy' }.configureEach { dependsOn 'stageLegendQuestBuddy' }

// ---------------------------------------------------------------------------
// Build stamp -- shared format across Sable's mods; LegendQuest main carries
// the reference. The COMMIT's time, not the wall clock: a wall-clock stamp
// changes every Gradle invocation, so nothing downstream is ever up to date.
// Tolerant of git being absent: an unknown stamp must never fail a build.
static String gitOut(File dir, String... args) {
    try {
        var proc = new ProcessBuilder(args).directory(dir).redirectErrorStream(true).start()
        var out = proc.inputStream.text.trim()
        return proc.waitFor() == 0 && !out.isEmpty() ? out : null
    } catch (Exception ignored) {
        return null
    }
}
var buildCommit = gitOut(projectDir, "git", "rev-parse", "--short=8", "HEAD") ?: "unknown"
var buildBranch = gitOut(projectDir, "git", "rev-parse", "--abbrev-ref", "HEAD") ?: "unknown"
if (gitOut(projectDir, "git", "status", "--porcelain")) buildCommit += "-dirty"
var commitEpoch = gitOut(projectDir, "git", "show", "-s", "--format=%ct", "HEAD")
var buildTime = commitEpoch
        ? new Date(commitEpoch.toLong() * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
        : "unknown"
logger.lifecycle("Build stamp: ${buildCommit} on ${buildBranch} at ${buildTime}")

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            build_commit           : buildCommit,
            build_branch           : buildBranch,
            build_time             : buildTime,
            lq_version_range       : lq_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                "Implementation-Title"  : mod_name,
                "Implementation-Version": mod_version,
                "Build-Commit"          : buildCommit,
                "Build-Branch"          : buildBranch,
                "Build-Time"            : buildTime,
        ])
    }
}
