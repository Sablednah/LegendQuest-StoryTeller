# Generated at build time -- do not edit. Namespaced under /storyteller/ so it
# cannot collide with another mod's copy on the classpath.
commit=${build_commit}
branch=${build_branch}
time=${build_time}
# mod_version alone is the SAME on all three Minecraft lines -- only the jar
# filename's +mc tag tells them apart. Carrying it here means the stamp and
# the filename answer with the same token, so "which jar is this" and "which
# build ran" cannot disagree. branch is a poor proxy: "main" says nothing
# about 1.21.11, and a source zip or detached checkout has no branch at all.
version=${mod_version}+mc${minecraft_version}
