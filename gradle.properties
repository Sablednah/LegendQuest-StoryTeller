# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.33-beta
# From .33, not from [26.3: NeoForge replaced DataPackRegistryEvent with
# NewDatapackRegistryEvent partway through the 26.3 betas (CityWorld bisected it
# to .20), so an earlier 26.3 build would crash at mod construction, not refuse
# to load. .33 is the build this was compiled and booted against. Other APIs may
# have moved between .20 and .33, so lower the floor only after running on
# the older build.
neo_version_range=[26.3.0.33-beta,26.4)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=storyteller
mod_name=LegendQuest StoryTeller
mod_license=MIT
mod_version=1.3.2
mod_group_id=com.sablednah.storyteller
mod_authors=Sablednah
mod_description=Run a live story for a server of LegendQuest characters. Spectate, possess, spawn, stage scenes and hand out rewards -- a Dungeon Master's toolkit, playable by vanilla clients.

## LegendQuest dependency
# The version range StoryTeller needs from LegendQuest. Every symbol it calls
# exists in 2.4.1, but 1.0.0 was only ever run against 2.5.0, and the two ship
# together. Loosen it only after actually running on the older one.
lq_version_range=[2.5.0,)

## Cast dependency (OPTIONAL, but the range is not optional)
# `/st swing` on a HUMAN body calls Cast.swing, which landed in Cast 1.1.0 --
# cast-1.0.0 does not have the method at all. An optional dependency with NO
# range is the dangerous shape: FML checks a range only when the mod IS
# present, so no range means 1.0.0 loads happily and the call becomes a
# NoSuchMethodError the first time a Storyteller swings at a person. The range
# turns that into "update Cast", said at boot.
cast_version_range=[1.1.0,)
