# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=1.21.11
minecraft_version_range=[1.21.11]
neo_version=21.11.42
# Any build in the 21.11 series, which is the series that targets MC 1.21.11.
neo_version_range=[21.11,21.12)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=storyteller
mod_name=LegendQuest StoryTeller
mod_license=MIT
mod_version=1.3.0
mod_group_id=com.sablednah.storyteller
mod_authors=Sablednah
mod_description=Run a live story for a server of LegendQuest characters. Spectate, possess, spawn, stage scenes and hand out rewards -- a Dungeon Master's toolkit, playable by vanilla clients.

## LegendQuest dependency
# The version range StoryTeller needs from LegendQuest. Every symbol it calls
# exists in 2.4.1, but 1.0.0 was only ever run against 2.5.0, and the two ship
# together -- a range admitting a version nobody has run it on is a guess, and
# this project has paid for three of those in one day. Loosen it only after
# actually running on the older one.
lq_version_range=[2.5.0,)

## Cast dependency (OPTIONAL, but the range is not optional)
# Cast is a soft dependency and stays one: without it the NPC tools say there
# are no NPCs and everything else works. But `/st swing` on a HUMAN body calls
# Cast.swing, which landed in Cast 1.1.0 -- cast-1.0.0 does not have the method
# at all (checked, not assumed: javap on all three 1.0.0 jars).
#
# An optional dependency with NO range is the dangerous shape, and this repo has
# paid for it three times in one day. FML only checks a range when the mod IS
# present, so no range means Cast 1.0.0 loads happily and the call becomes a
# NoSuchMethodError the first time a Storyteller swings at a person -- long
# after start-up, mid-scene, in a mod that looks innocent. The range converts
# that into "update Cast", said at boot.
cast_version_range=[1.1.0,)
